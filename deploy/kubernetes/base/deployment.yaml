apiVersion: apps/v1
kind: Deployment
metadata: {name: mosaic-erp}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: mosaic-erp}}
  template:
    metadata: {labels: {app: mosaic-erp}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints: [{maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: mosaic-erp}}}]
      containers:
        - name: mosaic-erp
          image: YOUR_DOCKERHUB_NAMESPACE/mosaic-erp@sha256:REPLACE_WITH_RELEASE_DIGEST
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: MOSAIC_HOST, value: "0.0.0.0"}
            - {name: MOSAIC_AUTO_MIGRATE, value: "false"}
            - name: MOSAIC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: mosaic-db, key: database-url}}
          startupProbe: {httpGet: {path: /health/ready, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
