{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mosaic.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "mosaic.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.databaseCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseCIDR | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    {{- end }}
{{- end }}
