{{- if .Values.database.runMigrationJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "mosaic.fullname" . }}-migrate-{{ .Release.Revision }}"
  annotations: {"helm.sh/hook": pre-install\,pre-upgrade, "helm.sh/hook-weight": "-5", "helm.sh/hook-delete-policy": before-hook-creation}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          command: [python, -c, "from postgres_store import PostgresStore; import os; s=PostgresStore(os.environ['MOSAIC_DATABASE_URL']); s.close()"]
          env:
            - name: MOSAIC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.migrationSecretName | quote }}, key: {{ .Values.database.migrationSecretKey | quote }}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
{{- end }}
