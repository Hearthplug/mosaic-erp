name: build-windows-installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - mosaic_launcher.py
      - scripts/smoke_exe.py
      - .github/workflows/build-windows-installer.yml
      - app.py
      - '*.html'
      - '*.css'
      - '*.js'
      - mosaic-logo.svg
  pull_request:
    paths:
      - mosaic_launcher.py
      - scripts/smoke_exe.py
      - .github/workflows/build-windows-installer.yml
      - app.py
      - '*.html'
      - '*.css'
      - '*.js'
      - mosaic-logo.svg
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Collect packaged data files
        shell: pwsh
        run: |
          $data = (Get-ChildItem -Name *.html,*.css,*.js,mosaic-logo.svg | ForEach-Object { "--add-data=$_;." }) -join ' '
          Set-Content -Path build-args.txt -Value $data
      - name: Build executable
        shell: pwsh
        run: pyinstaller --noconfirm --onefile --console --name MosaicERP $(Get-Content build-args.txt) mosaic_launcher.py
      - name: Smoke-test the executable
        run: python scripts/smoke_exe.py dist\MosaicERP.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosaicERP-windows-x64
          path: dist/MosaicERP.exe
          if-no-files-found: error
      - name: Attach to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" dist/MosaicERP.exe#MosaicERP-windows-x64.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
