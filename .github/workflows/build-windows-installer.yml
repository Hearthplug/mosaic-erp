name: build-windows-installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - mosaic_launcher.py
      - scripts/smoke_exe.py
      - scripts/assistant_provision.py
      - .github/workflows/build-windows-installer.yml
      - app.py
      - '*.html'
      - '*.css'
      - '*.js'
      - mosaic-logo.svg
  pull_request:
    paths:
      - mosaic_launcher.py
      - scripts/smoke_exe.py
      - scripts/assistant_provision.py
      - .github/workflows/build-windows-installer.yml
      - app.py
      - '*.html'
      - '*.css'
      - '*.js'
      - mosaic-logo.svg
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Fetch CI availability verdict for the local assistant
        shell: bash
        run: |
          RUN_ID=$(gh run list --workflow assistant-validation.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "availability source run: ${RUN_ID:-<none>}"
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          gh run download "$RUN_ID" --name local-assistant-availability
          python -c 'import json; d=json.load(open("local-assistant-availability.json")); assert d["schema"]=="mosaic-local-availability-v1" and d["available"] is True, d'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build executable
        shell: pwsh
        run: |
          $pyArgs = @('--noconfirm','--onefile','--console','--name','MosaicERP')
          Get-ChildItem -Name *.html,*.css,*.js,mosaic-logo.svg | ForEach-Object { $pyArgs += "--add-data=${_};." }
          $pyArgs += '--add-data=local-assistant-availability.json;.'
          # Frozen assistant contract: assistant_preview.py loads these by file
          # path at runtime, so PyInstaller must pack them as data.
          Get-ChildItem local_assistant_finetune/v3/runtime.py,local_assistant_finetune/v3/label_map.json,local_assistant_finetune/v3/slot_schemas.json,local_assistant_finetune/v3/intent_label.gbnf | ForEach-Object { $pyArgs += "--add-data=$($_.FullName);local_assistant_finetune/v3" }
          pyinstaller @pyArgs mosaic_launcher.py
      - name: Smoke-test the executable
        run: python scripts/smoke_exe.py dist\MosaicERP.exe
      - if: failure()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with: {name: smoke-exe-log, path: smoke-exe.log, if-no-files-found: ignore, retention-days: 14}
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        shell: pwsh
        run: makensis installer.nsi
      - name: Smoke-test the installer payload
        shell: pwsh
        run: |
          if (-not (Test-Path MosaicERP-windows-x64-setup.exe)) { throw 'NSIS installer was not produced' }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosaicERP-windows-x64
          path: |
            dist/MosaicERP.exe
            MosaicERP-windows-x64-setup.exe
          if-no-files-found: error
      - name: Attach to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp dist/MosaicERP.exe dist/MosaicERP-windows-x64.exe
          gh release upload "${{ github.ref_name }}" dist/MosaicERP-windows-x64.exe MosaicERP-windows-x64-setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
