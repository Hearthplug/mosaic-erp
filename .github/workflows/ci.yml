name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: {version: v3.18.6}
      - run: pip install --requirement requirements.txt
      - run: python3 -m unittest test_customization test_persistence test_postgres_contract test_auth_experience test_oauth test_operational_rbac_api test_concurrency_erp
      - run: python3 release_check.py
      - run: python3 scripts/validate_deployment.py
      - run: helm lint deploy/helm/mosaic-erp --strict
      - run: helm template mosaic deploy/helm/mosaic-erp --set image.repository=example/mosaic-erp --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set database.secretName=mosaic-db --set database.migrationSecretName=mosaic-db-owner --set networkPolicy.databaseCIDR=10.0.0.0/8 > /tmp/mosaic.yaml
      - run: docker build --pull --tag mosaic-erp:ci .
      - run: |
          set -e
          docker run -d --name mosaic -p 18000:8000 --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --mount type=volume,source=mosaic-ci-data,target=/data --cap-drop ALL --security-opt no-new-privileges mosaic-erp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18000/health/ready && exit 0; sleep 1; done
          docker logs mosaic
          exit 1
      - if: always()
        run: docker rm -f mosaic || true

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: mosaic}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d mosaic" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MOSAIC_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/mosaic?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: pip install --requirement requirements.txt
      - run: python3 -m unittest test_postgres_integration test_postgres_erp_live
