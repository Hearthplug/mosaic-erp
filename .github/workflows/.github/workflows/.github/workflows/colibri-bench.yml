name: Colibri head-to-head bench
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  current-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/benchmark_local_assistant.sh amd64
      - if: always()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with: {name: bench-current-amd64, path: 'benchmark-amd64.json*', if-no-files-found: error, retention-days: 30}
  colibri-olmoe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/bench_colibri_headtohead.sh
      - if: always()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with:
          name: bench-colibri-olmoe
          path: |
            benchmark-colibri-olmoe.json*
            colibri-olmoe-raw.jsonl
            server.log
          if-no-files-found: error
          retention-days: 30
  report:
    if: always()
    needs: [current-stack, colibri-olmoe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'bench-*', merge-multiple: true, path: verdicts}
      - run: |
          set -euo pipefail
          cd verdicts
          sha256sum -c benchmark-amd64.json.sha256
          sha256sum -c benchmark-colibri-olmoe.json.sha256
          python3 ../scripts/report_colibri_headtohead.py
          mv headtohead-report.json ..
      - if: always()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with: {name: colibri-headtohead-report, path: headtohead-report.json, if-no-files-found: error, retention-days: 30}
