name: Assistant and deployment validation
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  container-and-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with: {version: v3.18.6}
      - run: pip install --requirement requirements.txt
      - run: python3 -m unittest discover -q
      - run: helm lint deploy/helm/mosaic-erp --strict
      - run: helm template mosaic deploy/helm/mosaic-erp --set image.repository=example/mosaic-erp --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set database.secretName=mosaic-db --set database.migrationSecretName=mosaic-db-owner --set assistant.secretName=mosaic-assistant --set networkPolicy.databaseCIDR=10.0.0.0/8 > /tmp/mosaic.yaml
      - run: |
          set -euo pipefail
          grep -q 'MOSAIC_ASSISTANT_MOUNTED_SECRET_FILE' /tmp/mosaic.yaml
          grep -q 'readOnly: true' /tmp/mosaic.yaml
          docker build --pull -t mosaic-erp:assistant-ci .
          docker run -d --name mosaic-assistant-ci -p 18000:8000 --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev --mount type=volume,src=mosaic-assistant-ci-data,dst=/data --mount type=volume,src=mosaic-assistant-secrets,dst=/run/mosaic-assistant-secrets --cap-drop ALL --security-opt no-new-privileges mosaic-erp:assistant-ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:18000/assistant -o /tmp/assistant.html
          grep -q 'Set it up by talking' /tmp/assistant.html
          healthy=0
          for i in $(seq 1 30); do
            if test "$(docker inspect -f '{{.State.Health.Status}}' mosaic-assistant-ci)" = healthy; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
      - if: always()
        run: docker rm -f mosaic-assistant-ci || true
  local-model-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/benchmark_local_assistant.sh '${{ matrix.arch }}'
      - if: always()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with: {name: 'local-assistant-${{ matrix.arch }}', path: 'benchmark-${{ matrix.arch }}.json*', if-no-files-found: error, retention-days: 30}
  local-assistant-verdict:
    if: always()
    needs: local-model-benchmark
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.verdict.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'local-assistant-*', merge-multiple: true, path: verdicts}
      - id: verdict
        run: |
          set -euo pipefail
          (cd verdicts && sha256sum -c benchmark-amd64.json.sha256 && sha256sum -c benchmark-arm64.json.sha256)
          python3 scripts/check_local_assistant_availability.py verdicts/benchmark-amd64.json verdicts/benchmark-arm64.json
          echo "available=$(python3 -c 'import json; print(str(json.load(open("local-assistant-availability.json"))["available"]).lower())')" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@e454baaac2be505c9450e11b8f3215c6fc023ce8
        with: {name: local-assistant-availability, path: local-assistant-availability.json, if-no-files-found: error, retention-days: 30}
  local-assistant-availability:
    needs: local-assistant-verdict
    if: needs.local-assistant-verdict.outputs.available == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: local-assistant-availability}
      - run: python3 -c 'import json; assert json.load(open("local-assistant-availability.json"))["available"] is True'
