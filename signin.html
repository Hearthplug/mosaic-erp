<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to Mosaic</title><link rel="stylesheet" href="/static.css"><link rel="stylesheet" href="/signin.css"></head><body><main class="signin"><section class="intro"><b>MOSAIC</b><h1>Welcome back.</h1><p>Use your work email. Mosaic opens the right company and the work your role allows.</p></section><section class="card"><form id="login"><h2>Sign in</h2><label>Work email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label><button>Continue</button></form><section id="choose" hidden><h2>Choose a company</h2><p>Your account belongs to more than one Mosaic company.</p><div id="companies"></div></section><p id="error" role="alert"></p></section></main><script src="/auth.js"></script><script src="/signin.js"></script></body></html>
