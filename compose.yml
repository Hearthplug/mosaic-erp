services:
  app:
    build:
      context: .
      args:
        VERSION: ${MOSAIC_VERSION:-dev}
        VCS_REF: ${MOSAIC_VCS_REF:-local}
    image: ${MOSAIC_IMAGE:-mosaic-erp:local}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      MOSAIC_HOST: 0.0.0.0
      MOSAIC_DB_PATH: /data/mosaic.db
      MOSAIC_RATE_LIMIT_RPM: ${MOSAIC_RATE_LIMIT_RPM:-120}
    volumes:
      - mosaic-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        reservations: {cpus: "0.10", memory: 64M}
        limits: {cpus: "1.00", memory: 512M}
  caddy:
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      MOSAIC_DOMAIN: ${MOSAIC_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /config/caddy:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  mosaic-data:
  caddy-data:
